name: Deploy Laravel to CloudPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploying via SSH to CloudPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            cd /home/armetalbd-dolna/htdocs/dolna.armetalbd.com
            git config --global --add safe.directory /home/armetalbd-dolna/htdocs/dolna.armetalbd.com
            git reset --hard HEAD
            git pull origin main
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            chown -R armetalbd-dolna:armetalbd-dolna /home/armetalbd-dolna/htdocs/dolna.armetalbd.com
